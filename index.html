<html lang="en">

<style>
:root{
  --paper:#FBFAF8;
  --card:#FFFFFF;
  --ink:#1C1F24;
  --muted:#6C717B;
  --line:#E5E1D9;
  --hist:#2E6B4F;
  --hist-soft:#E8F0EB;
  --biz:#2B4A8B;
  --biz-soft:#E7ECF7;
  --now:#A9671F;
  --now-soft:#F7EEE2;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 72px}

/* ---------- header ---------- */
header{padding:30px 0 20px;border-bottom:1px solid var(--line)}
.kicker{font-size:13px;color:var(--muted);margin:0 0 6px}
h1{
  font-family:"Fraunces",Georgia,serif;
  font-weight:700;
  font-size:clamp(30px,5vw,44px);
  line-height:1.05;
  letter-spacing:-.015em;
  margin:0 0 18px;
  max-width:16ch;
}
.counts{display:flex;gap:14px;flex-wrap:wrap}
.count{
  flex:1 1 240px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:13px 15px;
  position:relative;
  overflow:hidden;
}
.count::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.count.h::before{background:var(--hist)}
.count.b::before{background:var(--biz)}
.count .name{font-size:12.5px;color:var(--muted);margin-bottom:2px;padding-right:86px;min-height:34px}
.count .when{font-family:"Fraunces",Georgia,serif;font-size:17px;font-weight:500;padding-right:86px}
.count .left{
  position:absolute;right:14px;top:13px;
  font-family:"IBM Plex Sans",sans-serif;font-size:12px;font-weight:600;
  padding:4px 9px;border-radius:20px;line-height:1.15;text-align:center;
}
.count.h .left{background:var(--hist-soft);color:var(--hist)}
.count.b .left{background:var(--biz-soft);color:var(--biz)}
.count .left small{display:block;font-size:10px;font-weight:500;opacity:.75}
.big{
  font-family:"Fraunces",Georgia,serif;font-weight:700;
  font-size:34px;line-height:1;letter-spacing:-.015em;
  margin:10px 0 0;display:block;
}
.count.h .big{color:var(--hist)}
.count.b .big{color:var(--biz)}
.big em{font-style:normal;font-size:.5em;margin-left:1px}
.bar{height:8px;background:#EDEAE3;border-radius:6px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s cubic-bezier(.2,.7,.3,1)}
.count.h .bar i{background:var(--hist)}
.count.b .bar i{background:var(--biz)}
.count .ratio{font-size:12.5px;color:var(--muted);margin-top:7px}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:22px;margin:26px 0 20px;border-bottom:1px solid var(--line)}
nav.tabs button{
  background:none;border:0;padding:0 0 11px;cursor:pointer;
  font-family:inherit;font-size:15px;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
nav.tabs button:focus-visible{outline:2px solid var(--biz);outline-offset:3px}

/* ---------- day rail ---------- */
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:22px;scrollbar-width:thin}
.day{
  flex:0 0 auto;min-width:88px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 11px 10px;cursor:pointer;font-family:inherit;color:var(--ink);
}
.day .dow{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.day .num{display:block;font-family:"Fraunces",Georgia,serif;font-size:22px;font-weight:700;line-height:1.1}
.day .dot{display:block;height:4px;border-radius:3px;background:#EDEAE3;margin-top:8px;overflow:hidden}
.day .dot i{display:block;height:100%;background:var(--now);width:0;transition:width .3s}
.day[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day.today{background:var(--now-soft);border-color:#E8D7BE}
.day.exam .num{color:var(--now)}
.day:focus-visible{outline:2px solid var(--biz);outline-offset:2px}

/* ---------- day header ---------- */
.dayhead{margin-bottom:18px}
.dayhead h2{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:700;margin:0 0 4px}
.dayhead p{margin:0;color:var(--muted);font-size:14px;max-width:62ch}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:74px}
.tl::before{content:"";position:absolute;left:56px;top:8px;bottom:8px;width:1px;background:var(--line)}
.slot{position:relative;margin-bottom:14px}
.slot .clock{
  position:absolute;left:-74px;top:14px;width:52px;text-align:right;
  font-family:"Fraunces",Georgia,serif;font-size:14px;font-weight:500;line-height:1.35;
}
.slot .clock span{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--muted);font-weight:400}
.slot::before{
  content:"";position:absolute;left:-22px;top:20px;width:9px;height:9px;border-radius:50%;
  background:var(--card);border:2px solid var(--line);
}
.slot.h::before{border-color:var(--hist)}
.slot.b::before{border-color:var(--biz)}
.slot.x::before{border-color:var(--now)}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px 8px}
.slot.h .block{border-left:3px solid var(--hist)}
.slot.b .block{border-left:3px solid var(--biz)}
.slot.x .block{border-left:3px solid var(--now);background:var(--now-soft)}
.block h3{margin:0 0 9px;font-size:14.5px;font-weight:600}
.slot.h .block h3{color:var(--hist)}
.slot.b .block h3{color:var(--biz)}
.slot.x .block h3{color:var(--now)}
.subj{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-right:8px;vertical-align:1px}
.slot.h .subj{background:var(--hist-soft);color:var(--hist)}
.slot.b .subj{background:var(--biz-soft);color:var(--biz)}
.slot.x .subj{background:#EFE6D8;color:var(--now)}

.dayhead .meter{
  display:inline-block;margin-left:11px;vertical-align:4px;
  font-family:"Fraunces",Georgia,serif;font-size:15px;font-weight:700;
  padding:2px 9px;border-radius:20px;background:var(--now-soft);color:var(--now);
}
.dayhead .meter.full{background:var(--hist-soft);color:var(--hist)}
#sync.on{color:var(--hist)}
#sync.off{color:#A03A2B}
.block .tag{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px}

/* break rows */
.break{
  position:relative;margin:0 0 14px;padding:9px 15px;
  border:1px dashed var(--line);border-radius:var(--radius);
  color:var(--muted);font-size:13.5px;background:transparent;
}
.break .clock{position:absolute;left:-74px;top:10px;width:52px;text-align:right;font-family:"Fraunces",Georgia,serif;font-size:14px}

/* ---------- task rows ---------- */
.task{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid #F1EEE8}
.task:first-of-type{border-top:0}
.task input{

  width:17px;height:17px;margin:2px 0 0;border:1.5px solid #C9C4B8;border-radius:4px;

.task input:hover{border-color:var(--ink)}
.task input:focus-visible{outline:2px solid var(--biz);outline-offset:2px}
.task input:checked{border-color:transparent}
.task.h input:checked{background:var(--hist)}
.task.b input:checked{background:var(--biz)}
.task.x input:checked{background:var(--now)}
.task input:checked::after{
  content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);

.task label{cursor:pointer;font-size:14px;flex:1}
.pri{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}
.pri.highest{background:#F6E1DC;color:#9C3B28}
.pri.very{background:#FAEBE5;color:#B0533A}
.pri.high{background:#F6EDDA;color:#8A6420}
.pri.light{background:#EEEEEA;color:#7C7F86}
.task .code{
  font-family:"Fraunces",Georgia,serif;font-size:12.5px;font-weight:700;
  padding:1px 6px;border-radius:4px;margin-right:7px;white-space:nowrap;
}
.task.h .code{background:var(--hist-soft);color:var(--hist)}
.task.b .code{background:var(--biz-soft);color:var(--biz)}
.task.x .code{background:#EFE6D8;color:var(--now)}
.task input:checked ~ label{color:var(--muted);text-decoration:line-through;text-decoration-color:#C9C4B8}

/* ---------- chapters view ---------- */
.group{margin-bottom:30px}
.group .ghead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.group h2{font-family:"Fraunces",Georgia,serif;font-size:21px;font-weight:700;margin:0}
.group .gcount{font-size:13px;color:var(--muted)}
.group .gpct{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:700;margin-left:9px}
.group.h .gpct{color:var(--hist)}
.group.b .gpct{color:var(--biz)}
.group .bar{margin:0 0 12px}
.group.h .bar i{background:var(--hist)}
.group.b .bar i{background:var(--biz)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 15px}
.list .task{padding:8px 0}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:13px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer button{background:none;border:0;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer}
footer button:hover{color:var(--ink)}
.hidden{display:none}

@media (max-width:640px){
  .wrap{padding:0 14px 60px}
  .tl{padding-left:58px}
  .tl::before{left:44px}
  .slot .clock,.break .clock{left:-58px;width:40px;font-size:13px}
  .slot::before{left:-18px}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ============ cloud sync ============ */
const SB_URL='https://vinatceutouhinuxqgej.supabase.co';
const SB_KEY='sb_publishable_J49djrBT3ELSnRDtwIsZ9w_4nbn8KtP';
const ROW='bereket';
const sbHeaders={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
let online=false, pushTimer=null;

function status(text,cls){const el=document.getElementById('sync');el.textContent=text;el.className=cls||''}

async function pull(){
  const r=await fetch(`${SB_URL}/rest/v1/exam_progress?id=eq.${ROW}&select=data`,{headers:sbHeaders});
  if(!r.ok)throw new Error(r.status);
  const rows=await r.json();
  return rows[0]?rows[0].data||{}:{};
}
async function push(){
  const r=await fetch(`${SB_URL}/rest/v1/exam_progress?id=eq.${ROW}`,{
    method:'PATCH',headers:{...sbHeaders,'Prefer':'return=minimal'},
    body:JSON.stringify({data:done,updated_at:new Date().toISOString()})});
  if(!r.ok)throw new Error(r.status);
}
function schedulePush(){
  if(!online){status('Offline, saved on this device only','off');return}
  status('Saving…');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    try{await push();status('Saved, synced to your other devices','on')}
    catch(e){online=false;status('Could not sync, saved on this device only','off')}
  },500);
}
async function startSync(){
  try{
    const remote=await pull();
    const local=done;
    // first run on a device: keep whatever the cloud has, plus anything only here
    done=Object.keys(remote).length?{...local,...remote}:local;
    online=true;save();renderAll();
    if(JSON.stringify(done)!==JSON.stringify(remote))await push();
    status('Saved, synced to your other devices','on');
  }catch(e){online=false;status('Offline, saved on this device only','off')}
}

/* ============ state ============ */
const KEY='exam-plan-2026-09';
const store=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return localStorage;}
  catch(e){const m={};return{getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}};}})();
let done={};
try{done=JSON.parse(store.getItem(KEY)||'{}')||{}}catch(e){done={}}
const save=()=>{try{store.setItem(KEY,JSON.stringify(done))}catch(e){}};

const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let current=(i=>i<0?PLAN.length-1:i)(PLAN.findIndex(d=>d.date>=todayISO()));

/* ============ render helpers ============ */
function taskRow(it){
  const isRef=!!it.ref;
  const id=isRef?it.ref:it.id;
  const kind=isRef?KIND(it.ref):(it.kind||'x');
  const code=isRef?CODE(it.ref):'';
  const text=isRef?TITLE[it.ref].t:it.text;
  const ref=isRef?TITLE[it.ref].ref:'';
  const uid='t_'+id+'_'+Math.random().toString(36).slice(2,7);
  const pri=isRef?(TITLE[it.ref].pri||''):'';
  const pb=pri?` <span class="pri ${pri.split(' ')[0].toLowerCase()}">${pri}</span>`:'';
  return `<div class="task ${kind}">
    <input type="checkbox" id="${uid}" data-id="${id}" ${done[id]?'checked':''}>
    <label for="${uid}">${code?`<span class="code">${code}</span>`:''}${text}${ref?` <span class="tag">${ref}</span>`:''}${pb}</label>
  </div>`;
}

function renderRail(){
  document.getElementById('rail').innerHTML=PLAN.map((d,i)=>{
    const ids=dayIds(d);
    const pct=ids.length?Math.round(100*ids.filter(x=>done[x]).length/ids.length):0;
    const cls=['day',d.date===todayISO()?'today':'',d.exam?'exam':''].filter(Boolean).join(' ');
    return `<button class="${cls}" data-i="${i}" aria-current="${i===current}">
      <span class="dow">${d.dow}${d.exam?' · exam':''}</span>
      <span class="num">${Number(d.date.slice(8))}</span>
      <span class="dot"><i style="width:${pct}%"></i></span>
    </button>`;
  }).join('');
}

function dayIds(d){
  const out=[];
  d.blocks.forEach(b=>{if(!b.lunch)(b.items||[]).forEach(it=>out.push(it.ref||it.id))});
  return out;
}

function renderDay(){
  const d=PLAN[current];
  const ids=dayIds(d);
  const dp=ids.length?Math.round(100*ids.filter(x=>done[x]).length/ids.length):0;
  document.getElementById('d-title').innerHTML=`${d.label}<span class="meter${dp===100?' full':''}">${dp}%</span>`;
  document.getElementById('d-note').textContent=d.note;
  document.getElementById('timeline').innerHTML=d.blocks.map(b=>{
    if(b.lunch) return `<div class="break"><span class="clock">${b.from}</span>${b.text}</div>`;
    const sub=b.kind==='h'?'History':b.kind==='b'?'Business':'Recall';
    return `<div class="slot ${b.kind}">
      <div class="clock">${b.from}<span>to ${b.to}</span></div>
      <div class="block">
        <h3><span class="subj">${sub}</span>${b.title}</h3>
        ${(b.items||[]).map(taskRow).join('')}
      </div>
    </div>`;
  }).join('');
}

function updateDayMeter(){
  const d=PLAN[current], ids=dayIds(d);
  const dp=ids.length?Math.round(100*ids.filter(x=>done[x]).length/ids.length):0;
  const m=document.querySelector('#d-title .meter');
  if(m){m.textContent=dp+'%';m.classList.toggle('full',dp===100)}
}

function renderGroups(){
  const g=[
    ['h','History, 27 topics',HIST],
    ['b','Perna, in exam priority order',PERNA],
    ['b','Ancillai, 8 chapters',ANC]
  ];
  document.getElementById('groups').innerHTML=g.map(([k,name,arr])=>{
    const n=arr.filter(([id])=>done[id]).length;
    const pct=Math.round(100*n/arr.length);
    return `<div class="group ${k}">
      <div class="ghead"><h2>${name}<span class="gpct">${pct}%</span></h2><span class="gcount">${n} of ${arr.length} done</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="list">${arr.map(([id])=>taskRow({ref:id})).join('')}</div>
    </div>`;
  }).join('');
}

function renderTop(){
  const hN=HIST.filter(([id])=>done[id]).length;
  const bAll=PERNA.concat(ANC);
  const bN=bAll.filter(([id])=>done[id]).length;
  document.getElementById('h-bar').style.width=(100*hN/HIST.length)+'%';
  document.getElementById('b-bar').style.width=(100*bN/bAll.length)+'%';
  const hP=Math.round(100*hN/HIST.length), bP=Math.round(100*bN/bAll.length);
  document.getElementById('h-big').innerHTML=hP+'<em>%</em>';
  document.getElementById('b-big').innerHTML=bP+'<em>%</em>';
  document.getElementById('h-ratio').textContent=`${hN} of ${HIST.length} topics covered`;
  document.getElementById('b-ratio').textContent=`${bN} of ${bAll.length} chapters covered`;
  const days=iso=>{
    const now=new Date(); const ex=new Date(iso+'T09:00:00');
    return Math.max(0,Math.ceil((ex-now)/86400000));
  };
  const set=(el,v)=>{document.getElementById(el).innerHTML=v+'<small>'+(v===1?'day left':'days left')+'</small>'};
  set('h-left',days('2026-09-15'));
  set('b-left',days('2026-09-16'));
}

function renderAll(){renderTop();renderRail();renderDay();renderGroups();}

/* ============ events ============ */
document.addEventListener('change',e=>{
  const cb=e.target.closest('input[type=checkbox][data-id]');
  if(!cb)return;
  const id=cb.dataset.id;
  if(cb.checked)done[id]=1;else delete done[id];
  save();schedulePush();renderTop();renderRail();updateDayMeter();
  document.querySelectorAll(`input[data-id="${id}"]`).forEach(o=>o.checked=cb.checked);
  const g=document.getElementById('groups');
  if(!g.parentElement.classList.contains('hidden'))renderGroups();
});

document.getElementById('rail').addEventListener('click',e=>{
  const b=e.target.closest('.day'); if(!b)return;
  current=Number(b.dataset.i); renderRail(); renderDay();
});

const tabs=[['tab-plan','view-plan'],['tab-ch','view-ch']];
tabs.forEach(([t,v])=>document.getElementById(t).addEventListener('click',()=>{
  tabs.forEach(([tt,vv])=>{
    const on=tt===t;
    document.getElementById(tt).setAttribute('aria-selected',on);
    document.getElementById(vv).classList.toggle('hidden',!on);
  });
  if(v==='view-ch')renderGroups();
}));

document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('Clear every tick? This cannot be undone.'))return;
  done={};save();schedulePush();renderAll();
});
document.getElementById('export').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(done)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='exam-progress.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
document.getElementById('import').addEventListener('click',()=>document.getElementById('file').click());
document.getElementById('file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{done=JSON.parse(r.result)||{};save();schedulePush();renderAll();}
    catch(err){status('That file could not be read. Pick the exam-progress.json you saved earlier.','off');}};
  r.readAsText(f);
});

renderAll();
startSync();
</script>
